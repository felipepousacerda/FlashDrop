# ============================================================
# FlashDrop - Orders Service - LOCAL DEVELOPMENT PROFILE
# Este archivo se activa automáticamente con: spring.profiles.active=local
# Sobrescribe application.properties para desarrollo local contra Supabase
# ============================================================

# ----------------------------
# DataSource - Supabase / PostgreSQL (valores desde .env)
# ----------------------------
# Valores copiados desde .env para desarrollo local
spring.datasource.url=jdbc:postgresql://supabase.srv1301661.hstgr.cloud:5432/postgres?sslmode=disable
spring.datasource.username=postgres
spring.datasource.password=Passsupagessof1!
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# ----------------------------
# Flyway - usar migraciones principales (Postgres)
# ----------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-on-migrate=true

# ----------------------------
# JPA - No alterar schema en Supabase, solo validar
# ----------------------------
spring.jpa.hibernate.ddl-auto=validate

# ----------------------------
# RabbitMQ - disabled locally (no bloqueará el arranque si falla)
# ----------------------------
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# ----------------------------
# Logging - más detalle en local
# ----------------------------
logging.level.cl.flashdrop=DEBUG
logging.level.org.springframework.jdbc=DEBUG
logging.level.org.flywaydb=DEBUG
