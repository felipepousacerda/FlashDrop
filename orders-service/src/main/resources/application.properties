# ============================================================
# FlashDrop - Orders Service
# ============================================================

# ----------------------------
# Server
# ----------------------------
server.port=8083
spring.application.name=orders-service

# ----------------------------
# DataSource (Supabase / PostgreSQL)
# ----------------------------
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/flashdrop}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:Passsupagessof1!}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP connection pool
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000

# ----------------------------
# JPA / Hibernate
# ----------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ----------------------------
# Flyway (Database Migrations) - DESHABILITADO
# La base de datos ya existe en Supabase. No se deben crear tablas.
# ----------------------------
spring.flyway.enabled=false
# spring.flyway.locations=classpath:db/migration
# spring.flyway.baseline-on-migrate=true

# ----------------------------
# RabbitMQ (opcional - el servicio arranca aunque RabbitMQ no esté disponible)
# ----------------------------
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

# Orders Exchange and Queues
orders.rabbitmq.exchange=orders.exchange
orders.rabbitmq.routing-key.order-created=order.created
orders.rabbitmq.routing-key.order-status-updated=order.status.updated
orders.rabbitmq.queue.order-created=orders.queue.created
orders.rabbitmq.queue.order-status-updated=orders.queue.status-updated

# ----------------------------
# Business Configuration
# ----------------------------
# Delivery fee in CLP (Chilean Pesos). Default: 2500
orders.delivery-fee=${DELIVERY_FEE:2500}

# Maximum number of orders a delivery person can claim at once
orders.max-claim-per-route=3

# Distance defaults when not provided by client
orders.default-distance-km=3.2
orders.default-estimated-minutes=20

# ----------------------------
# Logging
# ----------------------------
logging.level.cl.flashdrop=DEBUG
logging.level.org.springframework.amqp=INFO
logging.level.org.flywaydb=INFO
